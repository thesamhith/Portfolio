<article
  class="project-card{% if include.featured %} project-card--featured{% endif %}"
  data-project-category="{{ include.project.category }}"
>
  <a
    class="project-card__thumbnail"
    href="{{ include.project.url | relative_url }}"
    aria-label="Open {{ include.project.title }} case study"
  >
    {% if include.project.thumbnail %}
    <img
      src="{{ include.project.thumbnail | relative_url }}"
      alt="{{ include.project.title }} project preview"
      {%
      if
      include.project.thumbnail_focus
      %}
      style="object-position: {{ include.project.thumbnail_focus }};"
      {%
      endif
      %}
    />
    {% else %}
    <span
      class="thumbnail-placeholder thumbnail-placeholder--{{ include.project.name }}"
      aria-hidden="true"
    >
      <span>{{ include.project.title }}</span>
    </span>
    {% endif %}
  </a>

  <div class="project-card__top">
    <span class="project-card__index">
      {{ forloop.index | prepend: '0' | slice: -2, 2 }}
    </span>

    <span class="project-card__category"> {{ include.project.category }} </span>
  </div>

  <h2>
    <a href="{{ include.project.url | relative_url }}">
      {{ include.project.title }}
    </a>
  </h2>

  <p>{{ include.project.summary }}</p>

  <div class="project-card__bottom">
    <span>{{ include.project.tools }}</span>

    <a class="text-link" href="{{ include.project.url | relative_url }}">
      Read case study <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
