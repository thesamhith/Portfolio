<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} ·
      {{ site.author.name }}{% endif %}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="{% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.author.name }}{% endif %}"
    />
    <meta
      property="og:description"
      content="{{ page.description | default: site.description }}"
    />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta
      property="og:image"
      content="{{ '/assets/img/social-preview.svg' | absolute_url }}"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.author.name }}{% endif %}"
    />
    <meta
      name="twitter:description"
      content="{{ page.description | default: site.description }}"
    />
    <meta
      name="twitter:image"
      content="{{ '/assets/img/social-preview.svg' | absolute_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
      rel="icon"
      href="{{ '/assets/img/favicon.svg?v=2' | relative_url }}"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    {% if site.analytics.goatcounter_endpoint != "" %}
    <script
      data-goatcounter="{{ site.analytics.goatcounter_endpoint }}"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}"
          >{{ site.author.name }}<span>.</span></a
        >
        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <span aria-hidden="true">☾</span>
        </button>
        <nav aria-label="Main navigation">
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/experience/' | relative_url }}">Experience</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/skills/' | relative_url }}">Skills</a>
          <a href="{{ '/resume/' | relative_url }}">Resume</a>
        </nav>
      </div>
    </header>
    <main class="container">{{ content }}</main>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
        <div class="footer-links">
          <a href="{{ site.author.github }}">GitHub</a>
          <a href="{{ site.author.linkedin }}">LinkedIn</a>
          <a href="mailto:{{ site.author.email }}">Email</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
